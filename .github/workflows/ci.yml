name: CI

# 跑的就是"本机也能跑"的那几步：ruff → pytest。
# ⚠️ 真集成测试**不在这里**：它们要真 MySQL/WSL/Redis/SearXNG，而 GitHub 的 runner 是 Linux
#    （**没有 WSL**）⇒ 那 5 条只在 Windows 本机跑，见 README「如何验证这个项目」。
#
# 📌 曾经还有一个 `frontend-dist` job（重新构建前端 + `git diff --exit-code app/web/frontend/dist`，
#    用来防"改了前端忘了提交 dist"）。**2026-10-01 用户决定去掉**：他确认自己不会忘记先
#    `npm run build` 再 push。附带留档那次排查的结论 —— 两端产物不一致的根因是**行尾**：
#    Vite 模板在 Windows 工作树里是 CRLF，构建出的 `dist/index.html` 也带 CRLF，
#    而该文件被 git 判为二进制（`-text`）不做规范化；Linux CI 构建出 LF ⇒ 严格 diff 必红。
#    虽然 job 去掉了，`.gitattributes` 里那几条 `text eol=lf`（前端模板/静态资源/产物）**保留**：
#    它让仓库里的前端文本文件行尾统一，避免以后再被这件事绊住。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ⚠️ 不带 .env 也能跑：tests/conftest.py 会兜一个**假** key（真 key 从不进 CI）
      - name: 同步依赖（严格按 uv.lock）
        run: uv sync --frozen

      - name: 静态检查
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 单元 + 工具级测试
        run: uv run python -m pytest tests/ -v --tb=short
