[project]
name = "ai-agent-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "langchain==0.3.25",
  "langchain-community==0.3.25",
  "langchain-mcp-adapters==0.1.1",
  "langchain-openai==0.3.16",
  "langgraph>=0.6.0,<0.7.0",
  "openai==1.78.0",
  "psutil>=6.0.0",
  "pydantic>=2.11.4",
  "python-dotenv>=1.0.0",
  "chromadb>=1.5.9",
  "sentence-transformers>=5.5.1",
  "modelscope>=1.37.0",
  "pymysql>=1.2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph-checkpoint-sqlite<3",
  "aiosqlite<0.22",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
# async 测试直接用 `async def test_xxx()`，不需要逐个加 @pytest.mark.asyncio
asyncio_mode = "auto"
# 覆盖率：只统计 app/code_agent（MCP server 与 Agent 主体），报告未覆盖行
addopts = "--cov=app/code_agent --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# 说明（有 ignore 就必须写清原因，不默默放过）：
#   E501 行太长 -> 交给 formatter（ruff format）处理
#   B008 函数调用作为默认值 -> FastMCP/Pydantic 的 Field(...) 就是这么用的
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# evals/ 的题集与评分器是"数据 + 断言"性质，长字符串多，不参与风格检查
"evals/tasks.py" = ["E"]
